<style>
/* ============================================================
   acessibilidade.online — Design Tokens
   ============================================================ */

:root {
  /* ——— Color: Dark (default) ——— */
  --color-bg: #0D0F12;
  --color-surface: #161A20;
  --color-surface-2: #1E2330;
  --color-surface-3: #252B3B;
  --color-border: rgba(255, 255, 255, 0.08);
  --color-border-strong: rgba(255, 255, 255, 0.14);
  --color-text: #E8EAF0;
  --color-text-muted: #8A90A0;
  --color-text-subtle: #5A6070;

  --color-accent: #1B8FFF;
  --color-accent-hover: #3FA2FF;
  --color-accent-press: #0F7AE0;
  --color-accent-alt: #00D97E;   /* sucesso */
  --color-warning: #F5A623;
  --color-error: #FF4D4F;

  /* Azulejo — acento cultural, aparece em detalhes geométricos */
  --color-azulejo: #1E4A8F;
  --color-azulejo-soft: rgba(30, 74, 143, 0.18);

  /* ——— Typography ——— */
  --font-display: 'Syne', 'Manrope', system-ui, sans-serif;
  --font-body: 'Manrope', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  --text-xs: 12px;
  --text-sm: 14px;
  --text-base: 16px;
  --text-lg: 19px;
  --text-xl: 23px;
  --text-2xl: 28px;
  --text-3xl: 34px;
  --text-4xl: 41px;
  --text-5xl: 56px;
  --text-6xl: 72px;

  --leading-tight: 1.1;
  --leading-snug: 1.2;
  --leading-normal: 1.5;
  --leading-relaxed: 1.6;

  /* ——— Space (8pt) ——— */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;
  --space-20: 80px;
  --space-24: 96px;
  --space-32: 128px;

  /* ——— Radius ——— */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 20px;
  --radius-full: 9999px;

  /* ——— Motion ——— */
  --duration-instant: 100ms;
  --duration-fast: 150ms;
  --duration-base: 200ms;
  --duration-slow: 300ms;
  --duration-page: 400ms;

  --ease-out: cubic-bezier(0.0, 0.0, 0.2, 1.0);
  --ease-in: cubic-bezier(0.4, 0.0, 1.0, 1.0);
  --ease-inout: cubic-bezier(0.4, 0.0, 0.2, 1.0);

  /* ——— Shadows (light-mode only; dark uses surface steps) ——— */
  --shadow-sm: 0 1px 3px rgba(0,112,224,0.08), 0 1px 2px rgba(0,0,0,0.06);
  --shadow-md: 0 4px 12px rgba(0,112,224,0.10), 0 2px 4px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 32px rgba(0,112,224,0.12), 0 4px 8px rgba(0,0,0,0.08);

  /* ——— Density (tweakable) ——— */
  --density-scale: 1;

  /* ——— Layout ——— */
  --nav-height: 64px;
  --container-max: 1200px;
  --content-max: 72ch;
}

[data-theme="light"] {
  --color-bg: #F7F8FA;
  --color-surface: #FFFFFF;
  --color-surface-2: #F0F2F6;
  --color-surface-3: #E6E9EF;
  --color-border: rgba(17, 19, 24, 0.10);
  --color-border-strong: rgba(17, 19, 24, 0.18);
  --color-text: #111318;
  --color-text-muted: #5A6070;
  --color-text-subtle: #8A90A0;

  --color-accent: #0070E0;
  --color-accent-hover: #0A5FBF;
  --color-accent-press: #084C99;
  --color-accent-alt: #00A85E;
  --color-azulejo: #1E4A8F;
  --color-azulejo-soft: rgba(30, 74, 143, 0.10);
}

/* ——— Accent variations (tweakable) ——— */
[data-accent="verde"] {
  --color-accent: #00A85E;
  --color-accent-hover: #00C470;
  --color-accent-press: #008F4E;
}
[data-accent="azulejo"] {
  --color-accent: #1E4A8F;
  --color-accent-hover: #2E5FA8;
  --color-accent-press: #163A72;
}
[data-accent="laranja"] {
  --color-accent: #E87B2E;
  --color-accent-hover: #F28E45;
  --color-accent-press: #C7661D;
}

/* ——— Radius variations ——— */
[data-radius="sharp"] {
  --radius-sm: 2px;
  --radius-md: 4px;
  --radius-lg: 6px;
  --radius-xl: 10px;
}
[data-radius="round"] {
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-xl: 32px;
}

/* ——— Density variations ——— */
[data-density="compact"] {
  --density-scale: 0.82;
}

/* ============================================================
   Base
   ============================================================ */

* {
  box-sizing: border-box;
}

html {
  background: var(--color-bg);
  color: var(--color-text);
  color-scheme: dark;
}
html[data-theme="light"] { color-scheme: light; }

body {
  margin: 0;
  font-family: var(--font-body);
  font-size: var(--text-base);
  line-height: var(--leading-relaxed);
  background: var(--color-bg);
  color: var(--color-text);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  font-feature-settings: 'ss01', 'cv11';
}

/* Selection */
::selection {
  background: var(--color-accent);
  color: #fff;
}

/* Focus ring (universal) */
:focus {
  outline: none;
}
:focus-visible {
  outline: 3px solid var(--color-accent);
  outline-offset: 2px;
  border-radius: 2px;
}

/* Skip link */
.skip-link {
  position: absolute;
  top: -100px;
  left: var(--space-4);
  background: var(--color-accent);
  color: #fff;
  padding: var(--space-3) var(--space-5);
  border-radius: var(--radius-md);
  font-family: var(--font-body);
  font-weight: 600;
  font-size: var(--text-sm);
  text-decoration: none;
  z-index: 9999;
  transition: top var(--duration-base) var(--ease-out);
}
.skip-link:focus {
  top: var(--space-4);
  outline: 3px solid #fff;
  outline-offset: 2px;
}

/* Headings */
h1, h2, h3, h4 {
  font-family: var(--font-display);
  font-weight: 600;
  letter-spacing: -0.02em;
  margin: 0;
  line-height: var(--leading-tight);
}
h1 { font-size: var(--text-4xl); }
h2 { font-size: var(--text-3xl); }
h3 { font-size: var(--text-2xl); }
h4 { font-size: var(--text-xl); }

p { margin: 0; }

a {
  color: var(--color-accent);
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 3px;
  transition: color var(--duration-fast) var(--ease-out);
}
a:hover { color: var(--color-accent-hover); }

code, .mono {
  font-family: var(--font-mono);
  font-size: 0.92em;
}

button {
  font-family: var(--font-body);
  font-size: var(--text-base);
  cursor: pointer;
  border: none;
  background: none;
  color: inherit;
  padding: 0;
}

input, select, textarea {
  font-family: var(--font-body);
  font-size: var(--text-base);
  color: inherit;
}

hr {
  border: none;
  border-top: 1px solid var(--color-border);
  margin: var(--space-8) 0;
}

/* ============================================================
   Utility
   ============================================================ */

.container {
  max-width: var(--container-max);
  margin: 0 auto;
  padding: 0 var(--space-6);
}

.eyebrow {
  font-family: var(--font-body);
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--color-text-muted);
  margin: 0;
}

.lede {
  font-size: var(--text-lg);
  color: var(--color-text-muted);
  line-height: var(--leading-normal);
  max-width: 60ch;
}

.gradient-text {
  background: linear-gradient(90deg, var(--color-accent) 0%, var(--color-accent-alt) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

/* ============================================================
   Components
   ============================================================ */

.btn {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  padding: calc(var(--space-3) * var(--density-scale)) var(--space-5);
  min-height: 44px;
  border-radius: var(--radius-md);
  font-weight: 600;
  font-size: var(--text-base);
  line-height: 1;
  transition: all var(--duration-base) var(--ease-out);
  text-decoration: none;
  white-space: nowrap;
  border: 1px solid transparent;
}
.btn-primary {
  background: var(--color-accent);
  color: #fff;
}
.btn-primary:hover {
  background: var(--color-accent-hover);
  color: #fff;
  transform: translateY(-1px);
}
.btn-primary:active { transform: translateY(0); background: var(--color-accent-press); }

.btn-outline {
  background: transparent;
  color: var(--color-text);
  border-color: var(--color-border-strong);
}
.btn-outline:hover {
  border-color: var(--color-accent);
  color: var(--color-accent);
  background: var(--color-azulejo-soft);
}

.btn-ghost {
  background: transparent;
  color: var(--color-text-muted);
}
.btn-ghost:hover {
  color: var(--color-text);
  background: var(--color-surface-2);
}

.btn-sm { min-height: 36px; padding: var(--space-2) var(--space-3); font-size: var(--text-sm); }

/* Badge / Pill */
.badge {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  padding: 4px 10px;
  border-radius: var(--radius-full);
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 0.02em;
  border: 1px solid var(--color-border);
  background: var(--color-surface-2);
  color: var(--color-text-muted);
}
.badge-success {
  background: color-mix(in srgb, var(--color-accent-alt) 14%, transparent);
  color: var(--color-accent-alt);
  border-color: color-mix(in srgb, var(--color-accent-alt) 32%, transparent);
}
.badge-accent {
  background: color-mix(in srgb, var(--color-accent) 14%, transparent);
  color: var(--color-accent);
  border-color: color-mix(in srgb, var(--color-accent) 32%, transparent);
}
.badge-warning {
  background: color-mix(in srgb, var(--color-warning) 14%, transparent);
  color: var(--color-warning);
  border-color: color-mix(in srgb, var(--color-warning) 32%, transparent);
}
.badge-error {
  background: color-mix(in srgb, var(--color-error) 14%, transparent);
  color: var(--color-error);
  border-color: color-mix(in srgb, var(--color-error) 32%, transparent);
}

.card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-6);
  transition: all var(--duration-base) var(--ease-out);
}
[data-theme="light"] .card { box-shadow: var(--shadow-sm); }

/* Input */
.input {
  width: 100%;
  min-height: 44px;
  padding: var(--space-3) var(--space-4);
  background: var(--color-surface);
  border: 1px solid var(--color-border-strong);
  border-radius: var(--radius-md);
  color: var(--color-text);
  transition: border-color var(--duration-fast) var(--ease-out);
}
.input:focus-visible {
  border-color: var(--color-accent);
  outline: 3px solid var(--color-accent);
  outline-offset: 0;
  outline-color: color-mix(in srgb, var(--color-accent) 40%, transparent);
}

/* ============================================================
   Layout regions
   ============================================================ */

main {
  min-height: calc(100vh - var(--nav-height));
}

/* ============================================================
   Motion reduced
   ============================================================ */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* ============================================================
   Navigation
   ============================================================ */

.site-nav {
  position: sticky;
  top: 0;
  z-index: 100;
  height: var(--nav-height);
  background: color-mix(in srgb, var(--color-bg) 82%, transparent);
  backdrop-filter: blur(16px) saturate(1.4);
  -webkit-backdrop-filter: blur(16px) saturate(1.4);
  border-bottom: 1px solid var(--color-border);
}
.nav-inner {
  max-width: var(--container-max);
  margin: 0 auto;
  padding: 0 var(--space-6);
  height: 100%;
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: var(--space-8);
}

.nav-brand {
  display: inline-flex;
  align-items: center;
  gap: var(--space-3);
  color: var(--color-text);
  text-decoration: none;
  font-weight: 600;
}
.brand-mark {
  color: var(--color-accent);
  display: inline-flex;
}
.brand-text {
  font-family: var(--font-display);
  font-size: var(--text-lg);
  letter-spacing: -0.02em;
  line-height: 1;
}
.brand-root { color: var(--color-text); }
.brand-tld {
  color: var(--color-accent);
  font-weight: 500;
}

.nav-main {
  display: flex;
  justify-content: center;
  gap: var(--space-2);
}
.nav-link {
  display: inline-flex;
  align-items: center;
  padding: 8px 14px;
  font-size: var(--text-sm);
  font-weight: 500;
  color: var(--color-text-muted);
  text-decoration: none;
  border-radius: var(--radius-md);
  position: relative;
  transition: color var(--duration-fast) var(--ease-out);
}
.nav-link:hover { color: var(--color-text); }
.nav-link.is-active { color: var(--color-text); }
.nav-link.is-active::after {
  content: "";
  position: absolute;
  left: 14px; right: 14px;
  bottom: -2px;
  height: 2px;
  background: var(--color-accent);
  border-radius: 2px;
}

.nav-actions {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
}
.icon-btn {
  width: 40px; height: 40px;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: var(--radius-md);
  color: var(--color-text-muted);
  transition: all var(--duration-fast) var(--ease-out);
}
.icon-btn:hover { color: var(--color-text); background: var(--color-surface-2); }

.nav-divider {
  width: 1px;
  height: 20px;
  background: var(--color-border);
}

.lang-btn {
  display: inline-flex;
  gap: 4px;
  font-size: var(--text-xs);
  font-weight: 600;
  font-family: var(--font-mono);
  letter-spacing: 0.04em;
  padding: 8px 12px;
  border-radius: var(--radius-md);
  color: var(--color-text-muted);
  transition: color var(--duration-fast);
}
.lang-btn:hover { color: var(--color-text); }
.lang-active { color: var(--color-text); }
.lang-inactive { opacity: 0.5; }

/* ============================================================
   HERO
   ============================================================ */

.hero {
  position: relative;
  padding: var(--space-20) 0 var(--space-16);
  overflow: hidden;
  border-bottom: 1px solid var(--color-border);
}

.hero-bg {
  position: absolute;
  inset: 0;
  pointer-events: none;
  color: var(--color-azulejo);
  mask-image: radial-gradient(ellipse at 70% 30%, black, transparent 70%);
  -webkit-mask-image: radial-gradient(ellipse at 70% 30%, black, transparent 70%);
}
.azulejo {
  width: 100%;
  height: 100%;
}

.hero-inner {
  position: relative;
  z-index: 1;
}

.hero-meta {
  display: inline-flex;
  align-items: center;
  gap: var(--space-3);
  margin-bottom: var(--space-8);
  flex-wrap: wrap;
}
.hero-meta-sep {
  color: var(--color-text-subtle);
}
.hero-meta-text {
  font-size: var(--text-xs);
  color: var(--color-text-muted);
  letter-spacing: 0.08em;
}

.hero-title {
  font-family: var(--font-display);
  font-size: clamp(var(--text-4xl), 7vw, var(--text-6xl));
  line-height: 1.03;
  letter-spacing: -0.035em;
  font-weight: 600;
  max-width: 18ch;
  margin-bottom: var(--space-8);
}

.hero-lede {
  font-size: var(--text-xl);
  line-height: 1.4;
  max-width: 58ch;
  color: var(--color-text-muted);
  margin-bottom: var(--space-10);
}

.hero-cta {
  display: flex;
  gap: var(--space-3);
  margin-bottom: var(--space-16);
  flex-wrap: wrap;
}

/* Live contrast demo inside hero */
.hero-demo {
  margin-top: var(--space-8);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  max-width: 820px;
}
.demo-head {
  padding: var(--space-4) var(--space-6);
  border-bottom: 1px solid var(--color-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
  flex-wrap: wrap;
}
.demo-caption {
  font-size: var(--text-sm);
  color: var(--color-text-muted);
}
.demo-body {
  display: grid;
  grid-template-columns: 260px 1fr;
  gap: 0;
}
@media (max-width: 720px) {
  .demo-body { grid-template-columns: 1fr; }
}

.demo-swatches {
  padding: var(--space-5);
  border-right: 1px solid var(--color-border);
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}
@media (max-width: 720px) {
  .demo-swatches { border-right: none; border-bottom: 1px solid var(--color-border); }
}
.swatch {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}
.swatch-label {
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--color-text-muted);
}
.swatch-row {
  display: flex;
  align-items: center;
  gap: var(--space-3);
}
.swatch-row input[type="color"] {
  width: 44px; height: 44px;
  border: 1px solid var(--color-border-strong);
  border-radius: var(--radius-md);
  padding: 2px;
  background: var(--color-surface-2);
  cursor: pointer;
}
.swatch-hex {
  font-size: var(--text-sm);
  color: var(--color-text);
}

.demo-result {
  display: grid;
  grid-template-columns: 1fr 160px;
}
@media (max-width: 560px) {
  .demo-result { grid-template-columns: 1fr; }
}
.demo-sample {
  padding: var(--space-6);
  display: flex;
  gap: var(--space-5);
  align-items: center;
}
.demo-sample-big {
  font-family: var(--font-display);
  font-size: 56px;
  font-weight: 600;
  letter-spacing: -0.03em;
  line-height: 1;
}
.demo-sample-text {
  font-size: var(--text-sm);
  line-height: 1.5;
  max-width: 28ch;
}
.demo-meters {
  border-left: 1px solid var(--color-border);
  display: flex;
  flex-direction: column;
}
.meter {
  padding: var(--space-4) var(--space-4);
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 4px;
}
.meter + .meter { border-top: 1px solid var(--color-border); }
.meter-label {
  font-size: var(--text-xs);
  color: var(--color-text-muted);
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.meter-value {
  font-size: var(--text-lg);
  font-weight: 600;
  color: var(--color-text);
}
.meter-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: var(--text-xs);
  font-weight: 600;
}
.meter-tag.is-pass { color: var(--color-accent-alt); }
.meter-tag.is-warn { color: var(--color-warning); }
.meter-tag.is-fail { color: var(--color-error); }

/* ============================================================
   Section heads / Tools grid
   ============================================================ */

.tools {
  padding: var(--space-24) var(--space-6);
}
.section-head {
  max-width: 640px;
  margin-bottom: var(--space-12);
}
.section-head .eyebrow { margin-bottom: var(--space-3); }
.section-head h2 { margin-bottom: var(--space-4); }

.tool-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--space-6);
}
@media (max-width: 1024px) { .tool-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 640px) { .tool-grid { grid-template-columns: 1fr; } }

.tool-card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-6);
  display: flex;
  flex-direction: column;
  gap: var(--space-5);
  transition: all var(--duration-base) var(--ease-out);
  position: relative;
  overflow: hidden;
}
.tool-card:hover:not(.is-disabled) {
  transform: translateY(-2px);
  border-color: var(--color-border-strong);
  background: var(--color-surface-2);
}
[data-theme="light"] .tool-card:hover:not(.is-disabled) { box-shadow: var(--shadow-md); }
.tool-card.is-disabled {
  opacity: 0.72;
}

.tool-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.tool-num {
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--color-text-subtle);
  letter-spacing: 0.12em;
}

.tool-icon {
  color: var(--color-accent);
}
.tool-card:nth-child(2) .tool-icon { color: var(--color-accent-alt); }
.tool-card:nth-child(3) .tool-icon { color: var(--color-azulejo); }

.tool-body { flex: 1; }
.tool-title {
  font-family: var(--font-display);
  font-size: var(--text-2xl);
  font-weight: 600;
  letter-spacing: -0.02em;
  margin-bottom: 4px;
}
.tool-tag {
  font-size: var(--text-xs);
  color: var(--color-text-muted);
  margin-bottom: var(--space-3);
  letter-spacing: 0.04em;
}
.tool-desc {
  font-size: var(--text-base);
  color: var(--color-text-muted);
  line-height: 1.55;
}

.tool-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--space-2);
  padding: var(--space-4) 0;
  border-top: 1px solid var(--color-border);
  border-bottom: 1px solid var(--color-border);
}
.tool-stat-k {
  font-size: var(--text-xs);
  color: var(--color-text-subtle);
  letter-spacing: 0.04em;
  margin-bottom: 2px;
}
.tool-stat-v {
  font-size: var(--text-sm);
  color: var(--color-text);
  font-weight: 600;
}

.tool-foot {
  margin-top: auto;
}
.tool-cta {
  width: 100%;
  justify-content: space-between;
}
.tool-cta:hover {
  border-color: var(--color-accent);
  color: var(--color-accent);
}

/* ============================================================
   Principles strip
   ============================================================ */

.principles {
  padding: var(--space-12) var(--space-6) var(--space-16);
  border-top: 1px solid var(--color-border);
}
.principles-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--space-8);
}
@media (max-width: 900px) { .principles-grid { grid-template-columns: 1fr; } }
.principle-num {
  font-size: var(--text-xs);
  color: var(--color-accent);
  letter-spacing: 0.08em;
  margin-bottom: var(--space-3);
}
.principle-title {
  font-family: var(--font-display);
  font-size: var(--text-xl);
  font-weight: 600;
  letter-spacing: -0.02em;
  margin-bottom: var(--space-3);
}
.principle-body {
  font-size: var(--text-base);
  color: var(--color-text-muted);
  line-height: 1.55;
}

/* ============================================================
   Manifesto
   ============================================================ */

.manifesto {
  padding: var(--space-20) 0;
  border-top: 1px solid var(--color-border);
  background:
    linear-gradient(180deg, transparent 0%, var(--color-azulejo-soft) 100%);
  text-align: center;
}
.manifesto .eyebrow { margin-bottom: var(--space-6); }
.manifesto-quote {
  font-family: var(--font-display);
  font-size: clamp(var(--text-2xl), 4vw, var(--text-4xl));
  line-height: 1.2;
  letter-spacing: -0.025em;
  font-weight: 500;
  max-width: 22ch;
  margin: 0 auto;
  color: var(--color-text);
  position: relative;
}
.manifesto-quote em {
  font-style: italic;
  color: var(--color-accent);
  font-weight: 600;
}
.manifesto-quote strong {
  color: var(--color-accent-alt);
  font-weight: 600;
}
.manifesto-quote .mark {
  font-size: 2em;
  color: var(--color-accent);
  line-height: 0.5;
  font-family: Georgia, serif;
  margin-right: 4px;
}
.manifesto-sign {
  margin-top: var(--space-6);
  font-size: var(--text-sm);
  color: var(--color-text-muted);
}

/* ============================================================
   Footer
   ============================================================ */

.site-footer {
  border-top: 1px solid var(--color-border);
  background: var(--color-bg);
  padding: var(--space-16) 0 var(--space-6);
}
.footer-inner {
  display: grid;
  grid-template-columns: 1.4fr 2fr;
  gap: var(--space-16);
}
@media (max-width: 900px) {
  .footer-inner { grid-template-columns: 1fr; gap: var(--space-10); }
}

.footer-brand {
  display: flex;
  gap: var(--space-4);
  align-items: flex-start;
}
.footer-brand .brand-mark { color: var(--color-accent); }
.footer-wordmark {
  font-family: var(--font-display);
  font-size: var(--text-lg);
  letter-spacing: -0.02em;
  margin-bottom: var(--space-2);
}
.footer-tag {
  font-size: var(--text-sm);
  color: var(--color-text-muted);
  line-height: 1.5;
}

.footer-cols {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--space-6);
}
@media (max-width: 640px) { .footer-cols { grid-template-columns: 1fr 1fr; } }
.footer-col-title {
  font-family: var(--font-body);
  font-size: var(--text-xs);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--color-text-subtle);
  margin-bottom: var(--space-3);
}
.footer-col ul {
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}
.footer-col a {
  color: var(--color-text-muted);
  text-decoration: none;
  font-size: var(--text-sm);
  transition: color var(--duration-fast);
}
.footer-col a:hover { color: var(--color-text); text-decoration: underline; }

.footer-bottom {
  margin-top: var(--space-12);
  padding-top: var(--space-6);
  border-top: 1px solid var(--color-border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: var(--space-4);
  flex-wrap: wrap;
}
.footer-statement {
  display: inline-flex;
  align-items: center;
  gap: var(--space-3);
  flex-wrap: wrap;
}
.footer-lc {
  font-size: var(--text-xs);
  color: var(--color-text-subtle);
}
.footer-legal {
  font-size: var(--text-xs);
  color: var(--color-text-subtle);
}

/* ============================================================
   Page hero (shared by checklist / contraste / sobre)
   ============================================================ */

.page-hero {
  padding: var(--space-16) 0 var(--space-10);
  border-bottom: 1px solid var(--color-border);
}
.crumbs {
  display: flex;
  gap: var(--space-2);
  align-items: center;
  font-size: var(--text-sm);
  color: var(--color-text-muted);
  margin-bottom: var(--space-6);
}
.crumbs a {
  color: var(--color-text-muted);
  text-decoration: none;
}
.crumbs a:hover { color: var(--color-accent); }
.crumbs [aria-current="page"] { color: var(--color-text); }

.page-title {
  font-family: var(--font-display);
  font-size: clamp(var(--text-3xl), 5vw, var(--text-5xl));
  letter-spacing: -0.03em;
  line-height: 1.05;
  font-weight: 600;
  margin: var(--space-3) 0 var(--space-5);
  max-width: 20ch;
}
.page-hero .eyebrow { margin-bottom: var(--space-2); }

.page-hero-inline {
  margin-bottom: var(--space-4);
}

.page-hero-grid {
  display: grid;
  grid-template-columns: 1.3fr 1fr;
  gap: var(--space-10);
  align-items: end;
}
@media (max-width: 900px) { .page-hero-grid { grid-template-columns: 1fr; } }

/* ============================================================
   Checklist
   ============================================================ */

.progress-panel {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-5);
}
.progress-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: var(--space-4);
}
.progress-count {
  font-family: var(--font-mono);
  font-size: var(--text-2xl);
  font-weight: 600;
  letter-spacing: -0.02em;
}
.progress-count-done { color: var(--color-accent); }
.progress-count-sep { color: var(--color-text-subtle); margin: 0 4px; }
.progress-count-total { color: var(--color-text-muted); }
.progress-percent {
  font-family: var(--font-display);
  font-size: var(--text-3xl);
  font-weight: 600;
  letter-spacing: -0.02em;
  color: var(--color-text);
}

.progress-bar {
  height: 6px;
  background: var(--color-surface-3);
  border-radius: var(--radius-full);
  overflow: hidden;
  margin-bottom: var(--space-4);
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--color-accent), var(--color-accent-alt));
  transition: width var(--duration-slow) var(--ease-out);
  border-radius: var(--radius-full);
}
.progress-actions {
  display: flex;
  gap: var(--space-2);
  flex-wrap: wrap;
}

.checklist-body { padding: var(--space-10) 0 var(--space-20); }
.checklist-layout {
  display: grid;
  grid-template-columns: 260px 1fr;
  gap: var(--space-8);
  align-items: start;
}
@media (max-width: 900px) { .checklist-layout { grid-template-columns: 1fr; } }

.checklist-sidebar {
  position: sticky;
  top: calc(var(--nav-height) + var(--space-4));
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}
@media (max-width: 900px) { .checklist-sidebar { position: static; } }

.filter-group {}
.filter-title {
  font-family: var(--font-body);
  font-size: var(--text-xs);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--color-text-subtle);
  margin-bottom: var(--space-3);
}
.filter-list {
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.filter-pill {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 12px;
  border-radius: var(--radius-md);
  color: var(--color-text-muted);
  font-size: var(--text-sm);
  transition: all var(--duration-fast) var(--ease-out);
  min-height: 36px;
  text-align: left;
}
.filter-pill:hover { background: var(--color-surface-2); color: var(--color-text); }
.filter-pill.is-active {
  background: var(--color-surface-2);
  color: var(--color-accent);
  font-weight: 600;
  box-shadow: inset 2px 0 0 var(--color-accent);
}
.filter-pill-meta {
  font-size: var(--text-xs);
  color: var(--color-text-subtle);
}

.filter-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  padding: 6px 14px;
  border-radius: var(--radius-full);
  background: var(--color-surface-2);
  border: 1px solid var(--color-border);
  color: var(--color-text-muted);
  font-size: var(--text-sm);
  font-weight: 500;
  transition: all var(--duration-fast) var(--ease-out);
  min-height: 32px;
}
.chip:hover { color: var(--color-text); border-color: var(--color-border-strong); }
.chip.is-active {
  background: var(--color-accent);
  color: #fff;
  border-color: var(--color-accent);
}

.filter-group.hint {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-4);
}
.hint-text {
  font-size: var(--text-sm);
  line-height: 1.55;
  color: var(--color-text-muted);
}
.hint-text kbd {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 0.9em;
  padding: 2px 6px;
  background: var(--color-surface-3);
  border: 1px solid var(--color-border-strong);
  border-radius: var(--radius-sm);
  color: var(--color-text);
  margin: 0 2px;
}

.checklist-list-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: var(--space-4);
  flex-wrap: wrap;
  gap: var(--space-2);
}
.list-count { color: var(--color-text-muted); font-size: var(--text-sm); }
.list-count strong { color: var(--color-text); font-weight: 600; }

.checklist-items {
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.check-item {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  overflow: hidden;
  transition: background var(--duration-fast);
}
.check-item:hover { background: var(--color-surface-2); }
.check-item.is-checked .check-title { color: var(--color-text-muted); }

.check-row {
  display: flex;
  gap: var(--space-4);
  padding: var(--space-4);
  align-items: flex-start;
}
.check-box {
  width: 22px; height: 22px;
  flex: 0 0 22px;
  border: 1.5px solid var(--color-border-strong);
  border-radius: var(--radius-sm);
  background: transparent;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  transition: all var(--duration-instant) var(--ease-out);
  margin-top: 2px;
  cursor: pointer;
}
.check-item.is-checked .check-box {
  background: var(--color-accent-alt);
  border-color: var(--color-accent-alt);
}

.check-main { flex: 1; min-width: 0; }
.check-meta {
  display: flex;
  gap: 6px;
  align-items: center;
  margin-bottom: 6px;
  flex-wrap: wrap;
}
.check-cat, .check-wcag, .check-level {
  font-size: var(--text-xs);
  padding: 2px 8px;
  border-radius: var(--radius-sm);
  font-weight: 500;
  letter-spacing: 0.03em;
}
.check-cat {
  background: color-mix(in srgb, var(--color-azulejo) 30%, transparent);
  color: color-mix(in srgb, var(--color-text) 92%, var(--color-azulejo));
  border: 1px solid var(--color-azulejo-soft);
}
[data-theme="light"] .check-cat { background: var(--color-azulejo-soft); color: var(--color-azulejo); }
.check-wcag {
  background: var(--color-surface-3);
  color: var(--color-text-muted);
}
.check-level {
  background: transparent;
  color: var(--color-text-subtle);
  border: 1px solid var(--color-border);
}
.check-level.level-A { color: var(--color-accent-alt); border-color: color-mix(in srgb, var(--color-accent-alt) 40%, transparent); }
.check-level.level-AA { color: var(--color-accent); border-color: color-mix(in srgb, var(--color-accent) 40%, transparent); }
.check-level.level-AAA { color: var(--color-warning); border-color: color-mix(in srgb, var(--color-warning) 40%, transparent); }
.check-level.level-LEI { color: var(--color-accent); border-color: color-mix(in srgb, var(--color-accent) 40%, transparent); }
.check-level.level-BR { color: var(--color-accent); border-color: color-mix(in srgb, var(--color-accent) 40%, transparent); }
.check-level.level-DOC { color: var(--color-text-muted); }

.check-title {
  font-family: var(--font-body);
  font-size: var(--text-base);
  font-weight: 500;
  color: var(--color-text);
  text-align: left;
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: var(--space-3);
  padding: 0;
  background: transparent;
  transition: color var(--duration-fast);
  line-height: 1.4;
}
.check-title:hover { color: var(--color-accent); }
.chevron { transition: transform var(--duration-base) var(--ease-out); flex-shrink: 0; }
.check-item.is-expanded .chevron { transform: rotate(180deg); }

.check-detail {
  padding: 0 var(--space-4) var(--space-4) calc(var(--space-4) + 22px + var(--space-4));
  color: var(--color-text-muted);
  font-size: var(--text-sm);
  line-height: 1.6;
  border-top: 1px solid var(--color-border);
  padding-top: var(--space-4);
  margin-top: 0;
}

.empty-state {
  text-align: center;
  padding: var(--space-16);
  background: var(--color-surface);
  border: 1px dashed var(--color-border-strong);
  border-radius: var(--radius-lg);
  color: var(--color-text-muted);
}
.empty-icon {
  font-size: 48px;
  color: var(--color-text-subtle);
  font-weight: 300;
  margin-bottom: var(--space-3);
}

/* ============================================================
   Contraste page
   ============================================================ */

.contraste-body { padding: var(--space-10) 0 var(--space-20); }
.contraste-grid {
  display: grid;
  grid-template-columns: 360px 1fr;
  gap: var(--space-8);
  align-items: start;
}
@media (max-width: 1000px) { .contraste-grid { grid-template-columns: 1fr; } }

.contraste-controls {
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
  position: sticky;
  top: calc(var(--nav-height) + var(--space-4));
}
@media (max-width: 1000px) { .contraste-controls { position: static; } }

.color-pair {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: end;
  gap: var(--space-3);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-5);
}
.color-field-label {
  display: block;
  font-size: var(--text-xs);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--color-text-muted);
  margin-bottom: var(--space-2);
}
.color-field-inner {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}
.color-swatch-big {
  position: relative;
  width: 100%;
  aspect-ratio: 2 / 1;
  border-radius: var(--radius-md);
  border: 1px solid var(--color-border-strong);
  cursor: pointer;
  overflow: hidden;
}
.color-swatch-big input[type="color"] {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  opacity: 0;
  cursor: pointer;
  border: none;
}
.color-hex {
  font-size: var(--text-sm);
  text-align: center;
  padding: 8px;
  min-height: 36px;
}

.swap-btn {
  width: 40px; height: 40px;
  border-radius: var(--radius-full);
  background: var(--color-surface-2);
  color: var(--color-text-muted);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all var(--duration-fast) var(--ease-out);
  margin-bottom: 4px;
  border: 1px solid var(--color-border);
}
.swap-btn:hover { color: var(--color-accent); border-color: var(--color-accent); transform: rotate(180deg); }

.size-controls {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-5);
}
.sc-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: var(--space-2);
}
.sc-label {
  font-size: var(--text-xs);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--color-text-muted);
}
.sc-value { font-size: var(--text-sm); color: var(--color-text); font-weight: 600; }

.range {
  width: 100%;
  height: 6px;
  background: var(--color-surface-3);
  border-radius: var(--radius-full);
  -webkit-appearance: none;
  appearance: none;
  margin: var(--space-2) 0;
}
.range::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: var(--color-accent);
  border: 2px solid var(--color-bg);
  cursor: pointer;
  box-shadow: 0 0 0 1px var(--color-accent);
}
.range::-moz-range-thumb {
  width: 20px; height: 20px;
  border-radius: 50%;
  background: var(--color-accent);
  border: 2px solid var(--color-bg);
  cursor: pointer;
}

.weight-chips { display: flex; gap: 4px; flex-wrap: wrap; margin-top: var(--space-2); }

.suggestion-card {
  background: color-mix(in srgb, var(--color-accent) 10%, var(--color-surface));
  border: 1px solid color-mix(in srgb, var(--color-accent) 30%, var(--color-border));
  border-radius: var(--radius-lg);
  padding: var(--space-5);
}
.sugg-text { font-size: var(--text-sm); color: var(--color-text-muted); margin: var(--space-2) 0 var(--space-4); line-height: 1.5; }
.sugg-row {
  display: flex;
  align-items: center;
  gap: var(--space-3);
}
.sugg-swatch {
  width: 40px; height: 40px;
  border-radius: var(--radius-md);
  border: 1px solid var(--color-border-strong);
  flex-shrink: 0;
}
.sugg-info { flex: 1; }
.sugg-hex { font-size: var(--text-sm); font-weight: 600; color: var(--color-text); }
.sugg-lc { font-size: var(--text-xs); color: var(--color-text-muted); }

.contraste-result { display: flex; flex-direction: column; gap: var(--space-6); }

.result-big {
  padding: var(--space-12) var(--space-8);
  border-radius: var(--radius-xl);
  border: 1px solid var(--color-border);
  text-align: center;

<script>
/* ============================================================
   APCA — simplified contrast calculation
   Reference: https://github.com/Myndex/apca-w3
   This is a compact implementation suitable for UI demos.
   ============================================================ */

(function(global) {
  'use strict';

  // sRGB → Y (luminance)
  function sRGBtoY(rgb) {
    const mainTRC = 2.4;
    const r = Math.pow(rgb[0] / 255, mainTRC);
    const g = Math.pow(rgb[1] / 255, mainTRC);
    const b = Math.pow(rgb[2] / 255, mainTRC);
    return 0.2126729 * r + 0.7151522 * g + 0.0721750 * b;
  }

  function APCAcontrast(txtY, bgY) {
    const normBG = 0.56;
    const normTXT = 0.57;
    const revTXT = 0.62;
    const revBG = 0.65;
    const blkThrs = 0.022;
    const blkClmp = 1.414;
    const loClip = 0.1;
    const deltaYmin = 0.0005;
    const scaleBoW = 1.14;
    const scaleWoB = 1.14;

    // black level soft clamp
    txtY = txtY > blkThrs ? txtY : txtY + Math.pow(blkThrs - txtY, blkClmp);
    bgY  = bgY  > blkThrs ? bgY  : bgY  + Math.pow(blkThrs - bgY,  blkClmp);

    if (Math.abs(bgY - txtY) < deltaYmin) return 0;

    let SAPC = 0;
    let outputContrast = 0;

    if (bgY > txtY) { // light bg, dark text
      SAPC = (Math.pow(bgY, normBG) - Math.pow(txtY, normTXT)) * scaleBoW;
      outputContrast = SAPC < loClip ? 0 : SAPC - 0.027;
    } else { // dark bg, light text
      SAPC = (Math.pow(bgY, revBG) - Math.pow(txtY, revTXT)) * scaleWoB;
      outputContrast = SAPC > -loClip ? 0 : SAPC + 0.027;
    }
    return outputContrast * 100;
  }

  function hexToRgb(hex) {
    hex = hex.replace('#', '');
    if (hex.length === 3) hex = hex.split('').map(c => c+c).join('');
    const n = parseInt(hex, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }

  function rgbToHex(rgb) {
    return '#' + rgb.map(v => {
      const h = Math.max(0, Math.min(255, Math.round(v))).toString(16);
      return h.length === 1 ? '0' + h : h;
    }).join('');
  }

  // WCAG 2.x relative luminance
  function relLuminance(rgb) {
    const a = rgb.map(v => {
      v = v / 255;
      return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * a[0] + 0.7152 * a[1] + 0.0722 * a[2];
  }

  function wcagRatio(fg, bg) {
    const L1 = relLuminance(fg);
    const L2 = relLuminance(bg);
    const lighter = Math.max(L1, L2);
    const darker = Math.min(L1, L2);
    return (lighter + 0.05) / (darker + 0.05);
  }

  function apca(fgHex, bgHex) {
    const fg = hexToRgb(fgHex);
    const bg = hexToRgb(bgHex);
    return APCAcontrast(sRGBtoY(fg), sRGBtoY(bg));
  }

  function wcag(fgHex, bgHex) {
    return wcagRatio(hexToRgb(fgHex), hexToRgb(bgHex));
  }

  // APCA guidance (approx) for body text
  function apcaLevel(Lc) {
    const abs = Math.abs(Lc);
    if (abs >= 90) return { label: 'Excelente', grade: 'AAA+', pass: true };
    if (abs >= 75) return { label: 'Corpo de texto', grade: 'Lc 75+', pass: true };
    if (abs >= 60) return { label: 'Body (dark mode)', grade: 'Lc 60+', pass: true };
    if (abs >= 45) return { label: 'UI / labels', grade: 'Lc 45+', pass: 'ui' };
    if (abs >= 30) return { label: 'Decorativo', grade: 'Lc 30+', pass: false };
    return { label: 'Insuficiente', grade: '< 30', pass: false };
  }

  function wcagLevel(ratio) {
    if (ratio >= 7) return { grade: 'AAA', pass: true };
    if (ratio >= 4.5) return { grade: 'AA', pass: true };
    if (ratio >= 3) return { grade: 'AA Large', pass: 'large' };
    return { grade: 'Fail', pass: false };
  }

  global.APCAtool = {
    apca, wcag, apcaLevel, wcagLevel, hexToRgb, rgbToHex, relLuminance
  };
})(window);

</script>

// Checklist page — 71 critérios, 16 categorias, filtros, progresso, export
const ChecklistPage = ({ setRoute }) => {
  const data = window.CHECKLIST_DATA;
  const cats = React.useMemo(() => {
    const map = {};
    data.forEach(item => { map[item.cat] = (map[item.cat] || 0) + 1; });
    return [{ name: 'Tudo', count: data.length }, ...Object.entries(map).map(([name, count]) => ({ name, count }))];
  }, [data]);

  const [filter, setFilter] = React.useState('Tudo');
  const [levelFilter, setLevelFilter] = React.useState('all');
  const [checked, setChecked] = React.useState(() => {
    try { return JSON.parse(localStorage.getItem('ac.checklist') || '{}'); }
    catch { return {}; }
  });
  const [expanded, setExpanded] = React.useState({});

  React.useEffect(() => {
    localStorage.setItem('ac.checklist', JSON.stringify(checked));
  }, [checked]);

  const toggle = (i) => setChecked(prev => ({ ...prev, [i]: !prev[i] }));
  const toggleExp = (i) => setExpanded(prev => ({ ...prev, [i]: !prev[i] }));

  const filtered = data
    .map((item, i) => ({ ...item, idx: i }))
    .filter(it => filter === 'Tudo' || it.cat === filter)
    .filter(it => levelFilter === 'all' || it.level === levelFilter);

  const checkedCount = Object.values(checked).filter(Boolean).length;
  const percent = Math.round((checkedCount / data.length) * 100);

  // Per-category progress
  const catProgress = React.useMemo(() => {
    const m = {};
    data.forEach((it, i) => {
      if (!m[it.cat]) m[it.cat] = { total: 0, done: 0 };
      m[it.cat].total++;
      if (checked[i]) m[it.cat].done++;
    });
    return m;
  }, [data, checked]);

  const resetAll = () => {
    if (confirm('Desmarcar todos os 71 critérios?')) setChecked({});
  };

  return (
    <div className="checklist-page" data-screen-label="Checklist">
      <section className="page-hero">
        <div className="container">
          <nav className="crumbs" aria-label="Breadcrumb">
            <a href="#/" onClick={(e) => { e.preventDefault(); setRoute('hub'); }}>Início</a>
            <span aria-hidden="true">/</span>
            <span aria-current="page">Checklist</span>
          </nav>

          <div className="page-hero-grid">
            <div>
              <p className="eyebrow">Ferramenta 01</p>
              <h1 className="page-title">Checklist de acessibilidade</h1>

                WCAG 2.2 e da LBI. Marque o progresso, expanda os detalhes para
                entender o <em>porquê</em> de cada item, e exporte relatório ao fim.
              </p>
            </div>

            <div className="progress-panel">
              <div className="progress-head">
                <div>
                  <div className="eyebrow">Progresso</div>
                  <div className="progress-count mono">
                    <span className="progress-count-done">{checkedCount}</span>
                    <span className="progress-count-sep">/</span>
                    <span className="progress-count-total">{data.length}</span>
                  </div>
                </div>
                <div className="progress-percent" aria-live="polite">{percent}%</div>
              </div>
              <div className="progress-bar" role="progressbar" aria-valuenow={percent} aria-valuemin="0" aria-valuemax="100" aria-label="Progresso do checklist">
                <div className="progress-fill" style={{ width: `${percent}%` }}></div>
              </div>
              <div className="progress-actions">
                <button className="btn btn-sm btn-outline" onClick={resetAll}>
                  Limpar progresso
                </button>
                <button className="btn btn-sm btn-primary" disabled={checkedCount === 0}>
                  <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M8 2v9M4 7l4 4 4-4M2 13h12" stroke="currentColor" strokeWidth="1.6" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
                  </svg>
                  Baixar relatório
                </button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section className="checklist-body">
        <div className="container checklist-layout">
          <aside className="checklist-sidebar" aria-label="Filtros">
            <div className="filter-group">
              <h2 className="filter-title">Categorias</h2>
              <ul className="filter-list">
                {cats.map(c => (
                  <li key={c.name}>
                    <button
                      className={`filter-pill ${filter === c.name ? 'is-active' : ''}`}
                      onClick={() => setFilter(c.name)}
                      aria-pressed={filter === c.name}>
                      <span className="filter-pill-name">{c.name}</span>
                      <span className="filter-pill-meta">
                        {c.name !== 'Tudo' && catProgress[c.name] && (
                          <span className="mono">
                            {catProgress[c.name].done}/{catProgress[c.name].total}
                          </span>
                        )}
                        {c.name === 'Tudo' && <span className="mono">{c.count}</span>}
                      </span>
                    </button>
                  </li>
                ))}
              </ul>
            </div>

            <div className="filter-group">
              <h2 className="filter-title">Nível WCAG</h2>
              <div className="filter-chips">
                {[
                  { k: 'all', l: 'Tudo' },
                  { k: 'A', l: 'A' },
                  { k: 'AA', l: 'AA' },
                  { k: 'AAA', l: 'AAA' },
                ].map(l => (
                  <button key={l.k}

                    {l.l}

              </div>

            <div className="filter-group hint">

            </div>
          </aside>

          <div className="checklist-list-wrap">
            <div className="checklist-list-head">
              <div className="list-count">

                {filter !== 'Tudo' && <> em <strong>{filter}</strong></>}

              <button

                onClick={() => {
                  const allExp = filtered.every(it => expanded[it.idx]);

                  filtered.forEach(it => { next[it.idx] = !allExp; });

            <ul className="checklist-items" role="list">
              {filtered.map(item => (
                <ChecklistItem
                  key={item.idx}

                  checked={!!checked[item.idx]}
                  expanded={!!expanded[item.idx]}
                  onToggle={() => toggle(item.idx)}
                  onExpand={() => toggleExp(item.idx)}
                />
              ))}
              {filtered.length === 0 && (
                <li className="empty-state">
                  <div className="empty-icon">∅</div>
                  <h3>Nenhum critério neste filtro</h3>
                  <p>Tente combinar outra categoria com outro nível WCAG.</p>
                </li>
              )}
            </ul>
          </div>
        </div>
      </section>

      <SiteFooter setRoute={setRoute}/>
    </div>
  );

// Contraste page — WCAG + APCA dual verifier with smart suggestions
const ContrastePage = ({ setRoute }) => {
  const [fg, setFg] = React.useState('#1B8FFF');
  const [bg, setBg] = React.useState('#0D0F12');
  const [size, setSize] = React.useState(16);
  const [weight, setWeight] = React.useState(400);

  const lc = window.APCAtool.apca(fg, bg);
  const lcAbs = Math.abs(lc);
  const ratio = window.APCAtool.wcag(fg, bg);
  const apcaLv = window.APCAtool.apcaLevel(lc);
  const wcagLv = window.APCAtool.wcagLevel(ratio);

  // Suggestor — iterate toward a nearest-passing foreground
  const suggest = React.useMemo(() => {
    const target = 75; // APCA Lc target
    if (lcAbs >= target) return null;
    const bgRgb = window.APCAtool.hexToRgb(bg);
    const bgLum = window.APCAtool.relLuminance(bgRgb);
    const goDark = bgLum > 0.4;

    let best = fg;
    let bestLc = lcAbs;
    const startRgb = window.APCAtool.hexToRgb(fg);
    for (let step = 0; step <= 100; step += 2) {
      const factor = step / 100;
      const target = goDark ? 0 : 255;
      const rgb = startRgb.map(c => Math.round(c + (target - c) * factor));
      const hex = window.APCAtool.rgbToHex(rgb);
      const l = Math.abs(window.APCAtool.apca(hex, bg));
      if (l > bestLc) {
        bestLc = l;
        best = hex;
        if (l >= 75) return { hex, lc: l };
      }
    }
    return best !== fg ? { hex: best, lc: bestLc } : null;
  }, [fg, bg, lcAbs]);

  const swap = () => { const t = fg; setFg(bg); setBg(t); };

  const passClass = apcaLv.pass === true ? 'is-pass' : apcaLv.pass === 'ui' ? 'is-warn' : 'is-fail';

  return (
    <div className="contraste-page" data-screen-label="Contraste">
      <section className="page-hero">
        <div className="container">
          <nav className="crumbs" aria-label="Breadcrumb">
            <a href="#/" onClick={(e) => { e.preventDefault(); setRoute('hub'); }}>Início</a>
            <span aria-hidden="true">/</span>
            <span aria-current="page">Contraste</span>
          </nav>
          <p className="eyebrow">Ferramenta 02</p>
          <h1 className="page-title">Verificador de contraste</h1>
          <p className="lede">
            Dois padrões, lado a lado. <strong>WCAG 2.x</strong> calcula a razão matemática de
            luminância; <strong>APCA</strong> considera peso, tamanho e polaridade. Onde os dois
            discordam, APCA costuma estar mais perto do que o olho percebe.
          </p>
        </div>
      </section>

      <section className="contraste-body">
        <div className="container contraste-grid">
          {/* LEFT — Controls */}
          <div className="contraste-controls">
            <div className="color-pair">
              <ColorField label="Cor do texto" value={fg} onChange={setFg}/>
              <button className="swap-btn" onClick={swap} aria-label="Trocar cores entre texto e fundo">
                <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
                  <path d="M3 6h10l-3-3M15 12H5l3 3" stroke="currentColor" strokeWidth="1.6" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
                </svg>
              </button>
              <ColorField label="Cor de fundo" value={bg} onChange={setBg}/>
            </div>

            <div className="size-controls">
              <div className="sc-row">
                <label className="sc-label" htmlFor="size-slider">Tamanho</label>
                <span className="sc-value mono">{size}px</span>
              </div>
              <input id="size-slider" type="range" min="12" max="48" step="1" value={size}
                     onChange={(e) => setSize(Number(e.target.value))} className="range"/>

              <div className="sc-row" style={{ marginTop: 16 }}>
                <label className="sc-label">Peso</label>
                <span className="sc-value mono">{weight}</span>
              </div>
              <div className="weight-chips" role="radiogroup" aria-label="Peso da fonte">
                {[300, 400, 500, 600, 700, 800].map(w => (
                  <button key={w}
                          className={`chip ${weight === w ? 'is-active' : ''}`}
                          onClick={() => setWeight(w)}
                          role="radio"
                          aria-checked={weight === w}>{w}</button>
                ))}
              </div>
            </div>

            {suggest && (
              <div className="suggestion-card">
                <div className="eyebrow">Sugestão automática</div>
                <p className="sugg-text">
                  A combinação atual não atinge Lc 75. A cor mais próxima que passa:
                </p>
                <div className="sugg-row">
                  <div className="sugg-swatch" style={{ background: suggest.hex }} aria-hidden="true"/>
                  <div className="sugg-info">
                    <div className="mono sugg-hex">{suggest.hex.toUpperCase()}</div>
                    <div className="sugg-lc mono">Lc {suggest.lc.toFixed(1)}</div>
                  </div>
                  <button className="btn btn-sm btn-primary"
                          onClick={() => setFg(suggest.hex)}>
                    Aplicar
                  </button>
                </div>
              </div>
            )}
          </div>

          {/* RIGHT — Big result + preview */}
          <div className="contraste-result">
            <div className={`result-big result-big-${passClass}`} style={{ background: bg, color: fg }}>
              <div className="result-big-kind">APCA</div>
              <div className="result-big-value">

              </div>

                {apcaLv.pass === true
                  ? <><CheckIcon/> {apcaLv.label}</>
                  : apcaLv.pass === 'ui'
                    ? <><DotIcon/> Apenas para UI ({apcaLv.grade})</>
                    : <><XIcon/> {apcaLv.label}</>}
              </div>
            </div>

            <div className="result-parallel">
              <MetricCard
                title="APCA"
                subtitle="Percepção"
                value={`Lc ${lcAbs.toFixed(1)}`}
                status={apcaLv.pass}
                desc={apcaLv.pass === true ? apcaLv.label : apcaLv.pass === 'ui' ? 'Apenas para labels' : 'Abaixo do mínimo'}

                title="WCAG 2.2"
                subtitle="Razão matemática"
                value={`${ratio.toFixed(2)}:1`}
                status={ratio >= 4.5 ? true : ratio >= 3 ? 'ui' : false}
                desc={wcagLv.grade}
              />
            </div>

            <div className="preview-block" style={{ background: bg, color: fg }}>
              <div className="preview-tag mono" style={{ color: fg, opacity: 0.6 }}>PREVIEW · {size}px · {weight}</div>
              <p className="preview-sample" style={{ fontSize: size, fontWeight: weight, lineHeight: 1.5 }}>
                A acessibilidade não é um recurso que se adiciona; é a base sobre
                a qual tudo o mais se constrói. Um produto que exclui é, antes
                de mais nada, um produto mal projetado.
              </p>
              <p className="preview-small" style={{ fontSize: size * 0.75, fontWeight: weight, opacity: 0.85 }}>
                — Equipe acessibilidade.online, em referência à Lei Brasileira de Inclusão (2015)
              </p>
            </div>

            {/* Reference grid */}
            <div className="reference-grid">
              <h3 className="ref-title">Referência rápida</h3>
              <table className="ref-table">
                <thead>
                  <tr>
                    <th scope="col">Uso</th>
                    <th scope="col">APCA (Lc)</th>
                    <th scope="col">WCAG</th>
                  </tr>
                </thead>
                <tbody>
                  <tr><td>Body · light mode</td><td className="mono">≥ 75</td><td className="mono">≥ 4.5:1</td></tr>
                  <tr><td>Body · dark mode</td><td className="mono">≥ 60</td><td className="mono">≥ 4.5:1</td></tr>
                  <tr><td>Headlines (≥ 24px)</td><td className="mono">≥ 60</td><td className="mono">≥ 3:1</td></tr>
                  <tr><td>UI · labels</td><td className="mono">≥ 45</td><td className="mono">≥ 3:1</td></tr>
                  <tr><td>Decorativo</td><td className="mono">≥ 30</td><td className="mono">—</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </section>

      <SiteFooter setRoute={setRoute}/>
    </div>
  );
};

function ColorField({ label, value, onChange }) {
  return (
    <div className="color-field">
      <label className="color-field-label">{label}</label>
      <div className="color-field-inner">
        <span className="color-swatch-big" style={{ background: value }}>
          <input type="color" value={value} onChange={(e) => onChange(e.target.value)}
                 aria-label={label}/>
        </span>
        <input type="text" className="input color-hex mono" value={value.toUpperCase()}
               onChange={(e) => {
                 const v = e.target.value;
                 if (/^#[0-9A-Fa-f]{6}$/.test(v)) onChange(v);
                 else if (/^#[0-9A-Fa-f]{3}$/.test(v)) {
                   const c = v.slice(1);
                   onChange('#' + c.split('').map(x => x + x).join(''));
                 }
               }}
               aria-label={`${label} em hexadecimal`}/>
      </div>
    </div>
  );
}

function MetricCard({ title, subtitle, value, status, desc }) {
  const cls = status === true ? 'is-pass' : status === 'ui' ? 'is-warn' : 'is-fail';
  return (
    <div className={`metric-card ${cls}`}>
      <div className="metric-head">
        <div>
          <div className="metric-title">{title}</div>
          <div className="metric-sub">{subtitle}</div>
        </div>
        <div className={`metric-icon ${cls}`}>
          {status === true ? <CheckIcon/> : status === 'ui' ? <DotIcon/> : <XIcon/>}
        </div>
      </div>
      <div className="metric-value mono">{value}</div>
      <div className="metric-desc">{desc}</div>
    </div>
  );
}

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "light",
  "accent": "azulejo",
  "radius": "round",
  "density": "compact",
  "heroVariant": "azulejo",
  "displayFont": "syne"
}/*EDITMODE-END*/;

function readRoute() {
  const h = location.hash.replace('#/', '').replace('#', '').trim();
  if (!h || h === '/') return 'hub';
  if (['checklist','contraste','simulador','sobre','hub'].includes(h)) return h;
  return 'hub';
}

function App() {
  const [route, setRouteState] = React.useState(readRoute());
  const setRoute = (r) => {
    setRouteState(r);
    location.hash = r === 'hub' ? '/' : ('/' + r);
    window.scrollTo({ top: 0, behavior: 'auto' });
  };

  // Tweaks state
  const [tweaks, setTweaks] = React.useState(() => {
    try {
      const saved = JSON.parse(localStorage.getItem('ac.tweaks') || 'null');
      return { ...TWEAK_DEFAULTS, ...(saved || {}) };
    } catch { return { ...TWEAK_DEFAULTS }; }
  });
  const [tweaksOpen, setTweaksOpen] = React.useState(false);

  React.useEffect(() => {
    const html = document.documentElement;
    html.setAttribute('data-theme', tweaks.theme);
    html.setAttribute('data-accent', tweaks.accent);
    html.setAttribute('data-radius', tweaks.radius);
    html.setAttribute('data-density', tweaks.density);
    html.style.setProperty('--font-display',
      tweaks.displayFont === 'manrope'
        ? "'Manrope', system-ui, sans-serif"
        : "'Syne', 'Manrope', system-ui, sans-serif");
    localStorage.setItem('ac.tweaks', JSON.stringify(tweaks));
  }, [tweaks]);

  // Hash routing
  React.useEffect(() => {
    const onHash = () => setRouteState(readRoute());
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  // Edit mode protocol
  React.useEffect(() => {
    const onMsg = (e) => {
      const d = e.data;
      if (!d || !d.type) return;
      if (d.type === '__activate_edit_mode') setTweaksOpen(true);
      if (d.type === '__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const updateTweak = (k, v) => {
    setTweaks(prev => {
      const next = { ...prev, [k]: v };
      window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [k]: v } }, '*');
      return next;
    });
  };

  const setTheme = (t) => updateTweak('theme', t);

  return (
    <>
      <Nav route={route} setRoute={setRoute} theme={tweaks.theme} setTheme={setTheme}/>
      <main id="main" tabIndex="-1">
        {route === 'hub'       && <HubPage       setRoute={setRoute} heroVariant={tweaks.heroVariant} accent={tweaks.accent} theme={tweaks.theme}/>}
        {route === 'checklist' && <ChecklistPage setRoute={setRoute}/>}
        {route === 'contraste' && <ContrastePage setRoute={setRoute}/>}
        {route === 'simulador' && <SimuladorPage setRoute={setRoute}/>}
        {route === 'sobre'     && <SobrePage     setRoute={setRoute}/>}
      </main>

      {tweaksOpen && (
        <aside className="tweaks-panel" aria-label="Tweaks">
          <div className="tweaks-head">
            <div className="tweaks-title">Tweaks</div>
            <button className="icon-btn" onClick={() => setTweaksOpen(false)} aria-label="Fechar painel">
              <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
                <path d="M3 3 L11 11 M11 3 L3 11" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/>
              </svg>
            </button>
          </div>
          <div className="tweaks-body">
            <TweakRow label="Tema" value={tweaks.theme} onChange={(v) => updateTweak('theme', v)}
                      options={[['dark','Escuro'],['light','Claro']]}/>
            <TweakRow label="Accent" value={tweaks.accent} onChange={(v) => updateTweak('accent', v)}
                      options={[['azul','Azul'],['verde','Verde'],['azulejo','Azulejo'],['laranja','Laranja']]}/>
            <TweakRow label="Hero" value={tweaks.heroVariant} onChange={(v) => updateTweak('heroVariant', v)}
                      options={[['azulejo','Azulejo'],['plain','Limpo']]}/>
            <TweakRow label="Radius" value={tweaks.radius} onChange={(v) => updateTweak('radius', v)}
                      options={[['sharp','Sharp'],['med','Médio'],['round','Round']]}/>
            <TweakRow label="Densidade" value={tweaks.density} onChange={(v) => updateTweak('density', v)}
                      options={[['comfy','Confortável'],['compact','Compacta']]}/>
            <TweakRow label="Fonte display" value={tweaks.displayFont} onChange={(v) => updateTweak('displayFont', v)}
                      options={[['syne','Syne'],['manrope','Manrope']]}/>
          </div>
        </aside>
      )}
    </>
  );
}

function TweakRow({ label, value, onChange, options }) {
  return (
    <div className="tweak-row">
      <div className="tweak-label">{label}</div>
      <div className="tweak-group">
        {options.map(([k, l]) => (
          <button key={k}
                  className={`tweak-chip ${value === k ? 'is-active' : ''}`}
                  onClick={() => onChange(k)}
                  aria-pressed={value === k}>{l}</button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

</body>
